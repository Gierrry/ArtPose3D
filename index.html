/* ============================================================
   UNDO / REDO
============================================================ */

function poseSnapshot(){
  return serializePose(extractPoseFromPuppet(app.puppet));
}

function saveUndo(){
  app.undoStack.push(poseSnapshot());
  if(app.undoStack.length>30)app.undoStack.shift();
  app.redoStack.length=0;
}

function undo(){
  if(app.studioTab==="pose"&&app.poseMode==="dessiner"){
    if(!app.drawUndoStack.length){toast("Rien à annuler");return;}
    restoreDrawingSnapshot(app.drawUndoStack.pop());
    toast("Annulé");
    return;
  }
  if(!app.undoStack.length)return;
  app.redoStack.push(poseSnapshot());
  const prev=deserializePose(app.undoStack.pop());
  applyPoseToPuppet(app.puppet,prev);
  app.activeKF=-1;
  requestRender();
  toast("Annulé");
}

function redo(){
  if(app.studioTab==="pose"&&app.poseMode==="dessiner"){
    toast("Rétablissement indisponible pour le dessin");
    return;
  }
  if(!app.redoStack.length)return;
  app.undoStack.push(poseSnapshot());
  const next=deserializePose(app.redoStack.pop());
  applyPoseToPuppet(app.puppet,next);
  app.activeKF=-1;
  requestRender();
  toast("Rétabli");
}

/* ============================================================
   MODE DESSIN
============================================================ */

function ensureCanvas(){
  if(app.drawCanvas)return;
  const wrap=$("studio-figure-wrap");
  const c=document.createElement("canvas");
  c.className="draw-layer";
  wrap.appendChild(c);
  app.drawCanvas=c;
  app.drawCtx=c.getContext("2d");
  app.drawCtx.strokeStyle="#2b2a25";
  app.drawCtx.lineWidth=2.5;
  app.drawCtx.lineCap="round";
  app.drawCtx.lineJoin="round";

  function resize(){
    const rect=wrap.getBoundingClientRect();
    const ratio=Math.min(window.devicePixelRatio||1,2);
    const w=Math.max(1,Math.round(rect.width*ratio));
    const h=Math.max(1,Math.round(rect.height*ratio));
    if(c.width===w&&c.height===h)return;
    const old=(c.width&&c.height)?c.toDataURL():null;
    c.width=w;c.height=h;
    c.style.width=rect.width+"px";
    c.style.height=rect.height+"px";
    app.drawCtx.setTransform(ratio,0,0,ratio,0,0);
    if(old){
      const img=new Image();
      img.onload=()=>{app.drawCtx.drawImage(img,0,0,rect.width,rect.height);};
      img.src=old;
    }
  }
  resize();
  new ResizeObserver(resize).observe(wrap);

  function position(ev){
    const rect=c.getBoundingClientRect();
    return{x:ev.clientX-rect.left,y:ev.clientY-rect.top};
  }

  c.addEventListener("pointerdown",ev=>{
    if(app.studioTab!=="pose"||app.poseMode!=="dessiner")return;
    try{
      app.drawUndoStack.push(c.toDataURL());
      if(app.drawUndoStack.length>20)app.drawUndoStack.shift();
    }catch(e){}
    app.isDrawing=true;
    app.hasDrawing=true;
    c.setPointerCapture(ev.pointerId);
    const p=position(ev);
    app.drawCtx.beginPath();
    app.drawCtx.moveTo(p.x,p.y);
    ev.preventDefault();
  },{passive:false});

  c.addEventListener("pointermove",ev=>{
    if(!app.isDrawing)return;
    const p=position(ev);
    app.drawCtx.lineTo(p.x,p.y);
    app.drawCtx.stroke();
    ev.preventDefault();
  },{passive:false});

  const stop=()=>{app.isDrawing=false;};
  c.addEventListener("pointerup",stop);
  c.addEventListener("pointercancel",stop);
}

function restoreDrawingSnapshot(dataUrl){
  if(!app.drawCanvas||!app.drawCtx)return;
  const rect=app.drawCanvas.getBoundingClientRect();
  app.drawCtx.clearRect(0,0,app.drawCanvas.width,app.drawCanvas.height);
  if(!dataUrl){app.hasDrawing=false;return;}
  const img=new Image();
  img.onload=()=>{
    app.drawCtx.clearRect(0,0,app.drawCanvas.width,app.drawCanvas.height);
    app.drawCtx.drawImage(img,0,0,rect.width,rect.height);
  };
  img.src=dataUrl;
  app.hasDrawing=true;
}

/* ============================================================
   OMBRE (panneau lumière)
============================================================ */

let shadowLayer=null;
function drawShadowOnStudio(){
  /* on ajoute une silhouette décalée sous le SVG studio */
  const svg=svgStudio;
  const existing=svg.querySelector("#shadow-layer");
  if(existing)existing.remove();

  const shadow=document.createElementNS(NS,"g");
  shadow.setAttribute("id","shadow-layer");
  shadow.setAttribute("opacity","0.18");

  /* on projette les points du puppet sur le sol */
  const puppet=app.puppet;
  const J=puppet.J;
  const gy=puppet.groundY;
  const shift=Number($("light-angle").value)*1.1;
  const sq=.22;

  const s={};
  for(const k in J){
    if(!J[k])continue;
    const p=J[k];
    const h=gy-p.y;
    s[k]=new Vec3(p.x+shift*(h/180),gy-h*sq,p.z);
  }

  const cam=app.studioCam;
  function line(a,b){
    const A=cam.project(a),B=cam.project(b);
    shadow.appendChild(makeSVGLine(A,B));
  }
  function makeSVGLine(A,B){
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",A.x);l.setAttribute("y1",A.y);
    l.setAttribute("x2",B.x);l.setAttribute("y2",B.y);
    l.setAttribute("stroke","#2b2a25");
    l.setAttribute("stroke-width","2.4");
    l.setAttribute("stroke-linecap","round");
    return l;
  }

  const pairs=[
    ["hipR","kneeR"],["kneeR","ankleR"],["ankleR","toesR"],
    ["hipL","kneeL"],["kneeL","ankleL"],["ankleL","toesL"],
    ["pelvis","spineMid"],["spineMid","chest"],["chest","neck"],["neck","head"],
    ["shoulderL","shoulderR"],["hipL","hipR"],
    ["shoulderR","elbowR"],["elbowR","wristR"],["wristR","handR"],
    ["shoulderL","elbowL"],["elbowL","wristL"],["wristL","handL"]
  ];
  for(const[a,b] of pairs){
    if(s[a]&&s[b])line(s[a],s[b]);
  }

  svg.insertBefore(shadow,svg.firstChild);
}

/* ============================================================
   KEYFRAMES
============================================================ */

function updateActiveKeyframe(){
  if(app.activeKF>=0&&app.activeKF<app.keyframes.length){
    app.keyframes[app.activeKF]=poseSnapshot();
    persistMotion();
  }
}

function persistMotion(){
  store("artpose3d-motion",{keyframes:app.keyframes,speed:app.playingSpeed});
}

function renderKFs(){
  const row=$("kf-row");
  $$(".kf-thumb",row).forEach(e=>e.remove());
  const add=$("kf-add");

  app.keyframes.forEach((kf,index)=>{
    const thumb=document.createElement("div");
    thumb.className="kf-thumb"+(index===app.activeKF?" active":"");

    const svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 400 460");
    thumb.appendChild(svg);

    const tp=new Puppet();
    applyPoseToPuppet(tp,deserializePose(kf));
    const tc=new Camera();tc.W=400;tc.H=460;tc.distance=620;
    const tr=new Renderer3D(svg,tc);
    tr.showHandles=false;tr.showCOM=false;
    tr.render(tp,{showGrid:false,showBackground:false});

    const del=document.createElement("div");
    del.className="del";
    del.textContent="×";
    del.onclick=ev=>{
      ev.stopPropagation();
      app.keyframes.splice(index,1);
      if(app.activeKF===index)app.activeKF=-1;
      else if(app.activeKF>index)app.activeKF--;
      persistMotion();
      renderKFs();
    };
    thumb.appendChild(del);

    thumb.onclick=()=>{
      app.activeKF=index;
      const data=deserializePose(app.keyframes[index]);
      applyPoseToPuppet(app.puppet,data);
      $("timeline").value=app.keyframes.length>1?Math.round(index/(app.keyframes.length-1)*100):0;
      renderKFs();
      requestRender();
    };

    row.insertBefore(thumb,add);
  });
}

/* ============================================================
   MARCHE / COURSE (procédurales sur le puppet)
============================================================ */

const CYCLES={
  walk:{duration:1.4,armSwing:25,legSwing:30,torsoLean:4},
  run:{duration:.9,armSwing:55,legSwing:45,torsoLean:14}
};

function walkPoseAt(t,mode){
  /* On part de la pose neutre et on module les cibles */
  const base=poseNeutre();
  const cfg=CYCLES[mode];
  const phase=t*Math.PI*2;
  const ls=Math.sin(phase)*cfg.legSwing;

  base.T.ankleL=new Vec3(
    -32,
    205-Math.max(0,Math.sin(phase))*40,
    -ls
  );
  base.T.ankleR=new Vec3(
    32,
    205-Math.max(0,-Math.sin(phase))*40,
    ls
  );
  base.T.kneeL=new Vec3(-34,125-Math.max(0,Math.sin(phase))*20,-ls*.6);
  base.T.kneeR=new Vec3(34,125-Math.max(0,-Math.sin(phase))*20,ls*.6);

  const as=Math.sin(phase)*cfg.armSwing;
  base.T.handL=new Vec3(-115-as, -55, -as*.4);
  base.T.handR=new Vec3(115-as, -55, as*.4);
  base.T.elbowL=new Vec3(-76-as*.4,-55,-35+as*.2);
  base.T.elbowR=new Vec3(76-as*.4,-55,-35-as*.2);

  base.T.torso=new Vec3(0,-70+cfg.torsoLean,0);
  base.T.pelvis=new Vec3(0,35,0);
  base.grounded.L=false;base.grounded.R=false;
  return base;
}

function poseAt(t){
  if(app.keyframes.length>=2){
    const n=app.keyframes.length;
    const position=t*(n-1);
    const index=Math.min(Math.floor(position),n-2);
    const local=position-index;
    const a=deserializePose(app.keyframes[index]);
    const b=deserializePose(app.keyframes[index+1]);
    /* interpolation simple sur les positions T */
    const out=poseNeutre();
    for(const k in a.T){
      const av=a.T[k],bv=b.T[k];
      if(av&&av.x!==undefined){
        out.T[k]=new Vec3(
          av.x+(bv.x-av.x)*local,
          av.y+(bv.y-av.y)*local,
          av.z+(bv.z-av.z)*local
        );
      }else{
        out.T[k]=av+((bv||0)-(av||0))*local;
      }
    }
    return out;
  }
  return walkPoseAt(t,app.walkMode);
}

function showScreen(name,tab){

    $("btn-play").textContent="▶";
  }
  app.currentScreen=name;
  SCREENS.forEach(s=>{$("screen-"+s).hidden=s!==name;});
  $$(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.nav.split(":")[0]===name));

  if(name==="studio")setStudioTab(tab||app.studioTab);
  if(name==="galerie")renderGallery();
  if(name==="accueil")requestRender();
}

document.addEventListener("click",ev=>{
  const nav=ev.target.closest(".nav-btn");
  const go=ev.target.closest("[data-goto]");
  if(nav){
    const [s,t]=nav.dataset.nav.split(":");
    showScreen(s,t);
    return;
  }
  if(go){
    const [s,t]=go.dataset.goto.split(":");
    showScreen(s,t);
  }
});

const TITLES={pose:"Pose",lumiere:"Lumière",scene:"Scène"};

function setStudioTab(tab){
  app.studioTab=tab;
  $$(".tabs .tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===tab));
  $("studio-title").textContent=TITLES[tab];
  $("panel-pose").hidden=tab!=="pose";
  $("panel-lumiere").hidden=tab!=="lumiere";
  $("panel-scene").hidden=tab!=="scene";
  $("studio-figure-wrap").hidden=tab==="scene";
  $("scene").hidden=tab!=="scene";

  /* en mode lumière, on autorise l'orbit studio */
  if(tab==="lumiere"){
    app.poseMode="articulations";
  }
  if(tab==="scene"){
    renderKFs();
  }
  if(tab==="pose"){
    renderLib();
    if(app.poseMode==="dessiner"){
      app.poseMode="articulations";
      setPoseMode("articulations");
    }
  }
  requestRender();
}

$$(".tabs .tab").forEach(tab=>{
  tab.addEventListener("click",()=>{setStudioTab(tab.dataset.tab);});
});

/* ============================================================
   PANNEAU POSE
============================================================ */

function setPoseMode(mode){
  app.poseMode=mode;
  $$("[data-posemode]").forEach(b=>b.classList.toggle("active",b.dataset.posemode===mode));
  $("pose-hint").textContent=
    mode==="dessiner"
      ?"Dessinez librement par-dessus la silhouette."
      :"Tirez une main, un pied ou le buste. Le coude, le genou ou le dos suivent naturellement.";
  $("btn-clear-drawing").hidden=mode!=="dessiner";
  if(mode==="dessiner"){
    ensureCanvas();
    /* rotation caméra verrouillée en mode dessiner */
    app.orbitPointerId=null;
  }
  requestRender();
}

$$("[data-posemode]").forEach(b=>{
  b.addEventListener("click",()=>setPoseMode(b.dataset.posemode));
});

$("btn-undo").onclick=undo;
$("btn-redo").onclick=redo;

$("btn-reset-pose").onclick=()=>{
  saveUndo();
  applyPoseToPuppet(app.puppet,poseNeutre());
  app.activeLibId=null;
  app.activeKF=-1;
  requestRender();
  renderLib();
  toast("Posture réinitialisée");
};

$("btn-clear-drawing").onclick=()=>{
  if(!app.drawCanvas)return;
  try{
    app.drawUndoStack.push(app.drawCanvas.toDataURL());
    if(app.drawUndoStack.length>20)app.drawUndoStack.shift();
  }catch(e){}
  app.drawCtx.clearRect(0,0,app.drawCanvas.width,app.drawCanvas.height);
  app.hasDrawing=false;
  toast("Dessin effacé");
};

$("btn-lib-add").onclick=()=>{
  const name=prompt("Nom de la pose :","Ma pose");
  if(!name?.trim())return;
  const entry={id:"c"+Date.now(),name:name.trim().slice(0,18),pose:poseSnapshot()};
  app.customLib.unshift(entry);
  store("artpose3d-custom-lib",app.customLib);
  app.activeLibId=entry.id;
  renderLib();
  toast("Pose ajoutée");
};

$("btn-save-pose").onclick=()=>{
  let drawing=null;
  if(app.drawCanvas&&app.poseMode==="dessiner"&&app.hasDrawing){
    try{drawing=app.drawCanvas.toDataURL("image/png");}catch(e){}
  }
  app.gallery.unshift({
    id:Date.now(),type:"pose",
    pose:poseSnapshot(),
    ...(drawing?{drawing}:{})
  });
  persistGallery();
  toast(drawing?"Pose et dessin enregistrés":"Pose enregistrée");
};

/* ============================================================
   PANNEAU LUMIÈRE
============================================================ */

$("light-angle").value=app.lightAngle;
$("light-angle").oninput=()=>{
  app.lightAngle=Number($("light-angle").value);
  store("artpose3d-light-angle",app.lightAngle);
  drawShadowOnStudio();
};

$("btn-save-ombre").onclick=()=>{
  app.gallery.unshift({
    id:Date.now(),type:"ombre",
    pose:poseSnapshot(),
    lightAngle:app.lightAngle
  });
  persistGallery();
  toast("Étude d'ombre enregistrée");
};

/* ============================================================
   PANNEAU SCÈNE
============================================================ */

const BG_SW=[
  "linear-gradient(180deg,#efe6d3,#d9cba4)",
  "linear-gradient(180deg,#2c2c30,#16161a)",
  "linear-gradient(180deg,#bcd8e0,#7fae86 75%,#6f9166)",
  "repeating-linear-gradient(0deg,#fbf7ef,#fbf7ef 22px,#dcd3bd 23px)"
];

$("bg-swatches").innerHTML=BG_SW.map((bg,i)=>
  `<div class="bg-swatch${i===sceneBgIndex?" active":""}" data-bg="${i}" style="background:${bg}"></div>`
).join("");

$("bg-swatches").addEventListener("click",ev=>{
  const sw=ev.target.closest(".bg-swatch");
  if(!sw)return;
  sceneBgIndex=Number(sw.dataset.bg);
  $$(".bg-swatch").forEach(x=>x.classList.toggle("active",x===sw));
  requestRender();
});

$("scene-scale").oninput=ev=>{
  const s=Number(ev.target.value)/100;
  app.sceneCam.focal=570*s;
  requestRender();
};

$("speed-row").innerHTML=[.5,1,2].map(v=>
  `<button class="speed-btn${v===app.playingSpeed?" active":""}" data-speed="${v}">${v}x</button>`
).join("");

$("speed-row").addEventListener("click",ev=>{
  const b=ev.target.closest(".speed-btn");
  if(!b)return;
  app.playingSpeed=Number(b.dataset.speed);
  $$("#speed-row .speed-btn").forEach(x=>x.classList.toggle("active",x===b));
  persistMotion();
});

$("cycle-row").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-cycle]");
  if(!b)return;
  app.walkMode=b.dataset.cycle;
  $$("#cycle-row .speed-btn").forEach(x=>x.classList.toggle("active",x===b));
  toast(app.walkMode==="walk"?"Cycle de marche":"Cycle de course");
});

$("btn-play").onclick=()=>{
  app.playing=!app.playing;
  $("btn-play").textContent=app.playing?"❚❚":"▶";
  if(!app.playing){cancelAnimationFrame(app.animationFrame);return;}

  app.playStart=performance.now();
  function loop(now){
    if(!app.playing)return;
    const duration=app.keyframes.length>=2
      ?2600/app.playingSpeed
      :CYCLES[app.walkMode].duration*1000/app.playingSpeed;
    const t=((now-app.playStart)%duration)/duration;
    $("timeline").value=Math.round(t*100);
    applyPoseToPuppet(app.puppet,poseAt(t));
    requestRender();
    app.animationFrame=requestAnimationFrame(loop);
  }
  app.animationFrame=requestAnimationFrame(loop);
};

$("timeline").addEventListener("input",ev=>{
  app.playing=false;
  cancelAnimationFrame(app.animationFrame);
  $("btn-play").textContent="▶";
  const t=Number(ev.target.value)/100;
  applyPoseToPuppet(app.puppet,poseAt(t));
  app.activeKF=-1;
  renderKFs();
  requestRender();
});

$("kf-add").onclick=()=>{
  if(app.keyframes.length>=4){toast("Maximum 4 images-clés");return;}
  saveUndo();
  app.keyframes.push(poseSnapshot());
  app.activeKF=app.keyframes.length-1;
  persistMotion();
  renderKFs();
  toast("Image-clé "+app.keyframes.length+" ajoutée");
};

$("btn-reset-scene").onclick=()=>{
  saveUndo();
  applyPoseToPuppet(app.puppet,poseNeutre());
  app.activeLibId=null;
  app.sceneCam.reset();
  app.sceneCam.W=400;app.sceneCam.H=460;
  app.sceneCam.distance=620;
  $("scene-scale").value=100;
  requestRender();
  toast("Scène réinitialisée");
};

$("btn-save-scene").onclick=()=>{
  const base={
    bg:sceneBgIndex,
    view:{
      yaw:app.sceneCam.yaw,
      pitch:app.sceneCam.pitch,
      distance:app.sceneCam.distance
    }
  };

  if(app.keyframes.length>=2){
    app.gallery.unshift({
      id:Date.now(),type:"scene-animation",
      keyframes:app.keyframes.map(k=>({...k})),
      speed:app.playingSpeed,
      ...base
    });
    toast("Animation enregistrée");
  }else{
    app.gallery.unshift({
      id:Date.now(),type:"scene",
      pose:poseSnapshot(),
      ...base
    });
    toast("Scène enregistrée");
  }
  persistGallery();
};

/* ============================================================
   GALERIE
============================================================ */

const BADGE={ombre:"☀ Ombre",scene:"▣ Scène","scene-animation":"▶ Scène animée",pose:"◑ Pose"};

function persistGallery(){store("artpose3d-gallery",app.gallery);}

function renderGallery(){
  const holder=$("gallery-content");
  if(!app.gallery.length){
    holder.innerHTML=`
      <div class="gallery-empty">
        Votre galerie est vide.
        <br>
        Enregistrez vos premières poses.
      </div>`;
    return;
  }

  holder.innerHTML=`<div class="gallery-grid"></div>`;
  const grid=holder.firstElementChild;

  app.gallery.forEach((item,index)=>{
    const cell=document.createElement("div");
    cell.className="gallery-item";

    if(item.type==="scene"||item.type==="scene-animation"){
      cell.style.background=BG_SW[item.bg||0];
    }

    const svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 400 460");
    cell.appendChild(svg);

    /* puppet jetable pour le rendu */
    const tp=new Puppet();
    const poseData=item.type==="scene-animation"
      ?deserializePose(item.keyframes[0])
      :(item.pose?deserializePose(item.pose):poseNeutre());
    applyPoseToPuppet(tp,poseData);

    const tc=new Camera();
    tc.W=400;tc.H=460;tc.distance=620;
    if(item.view){
      tc.yaw=item.view.yaw??Math.PI;
      tc.pitch=item.view.pitch??-.08;
      tc.distance=item.view.distance??620;
    }
    const tr=new Renderer3D(svg,tc);
    tr.showHandles=false;
    tr.showCOM=false;
    tr.render(tp,{showGrid:false,showBackground:false});

    if(item.type==="ombre"){
      /* ombre simple : on dessine un décalage */
      /* optionnel, on laisse vide pour l'instant */
    }

    if(item.drawing){
      const img=document.createElement("img");
      img.src=item.drawing;
      img.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;";
      cell.appendChild(img);
    }

    let label=BADGE[item.type]||"Pose";
    if(item.type==="pose"&&item.drawing)label="✎ Dessin";

    const badge=document.createElement("div");
    badge.textContent=label;
    badge.style.cssText="position:absolute;left:6px;bottom:6px;background:rgba(43,42,37,.68);color:white;font-size:10px;font-weight:600;padding:3px 7px;border-radius:8px;z-index:5;";
    cell.appendChild(badge);

    const del=document.createElement("div");
    del.className="del";
    del.textContent="×";
    del.onclick=ev=>{
      ev.stopPropagation();
      app.gallery.splice(index,1);
      persistGallery();
      renderGallery();
    };
    cell.appendChild(del);

    cell.onclick=()=>loadGalleryItem(item);
    grid.appendChild(cell);
  });
}

function loadGalleryItem(item){
  if(item.type==="scene-animation"){
    app.keyframes=item.keyframes.map(k=>({...k}));
    app.playingSpeed=item.speed||1;
    app.activeKF=app.keyframes.length?0:-1;
    if(app.keyframes.length){
      applyPoseToPuppet(app.puppet,deserializePose(app.keyframes[0]));
    }
    sceneBgIndex=item.bg||0;
    if(item.view){
      app.sceneCam.yaw=item.view.yaw??Math.PI;
      app.sceneCam.pitch=item.view.pitch??-.08;
      app.sceneCam.distance=item.view.distance??620;
    }
    persistMotion();
    showScreen("studio","scene");
    renderKFs();
    requestRender();
    toast("Animation chargée");
    return;
  }

  if(item.type==="scene"){
    applyPoseToPuppet(app.puppet,deserializePose(item.pose));
    sceneBgIndex=item.bg||0;
    if(item.view){
      app.sceneCam.yaw=item.view.yaw??Math.PI;
      app.sceneCam.pitch=item.view.pitch??-.08;
      app.sceneCam.distance=item.view.distance??620;
    }
    showScreen("studio","scene");
    requestRender();
    toast("Scène chargée");
    return;
  }

  if(item.type==="ombre"){
    applyPoseToPuppet(app.puppet,deserializePose(item.pose));
    $("light-angle").value=item.lightAngle||0;
    app.lightAngle=item.lightAngle||0;
    showScreen("studio","lumiere");
    requestRender();
    toast("Étude d'ombre chargée");
    return;
  }

  applyPoseToPuppet(app.puppet,deserializePose(item.pose));
  showScreen("studio","pose");

  if(item.drawing){
    setPoseMode("dessiner");
    ensureCanvas();
    const img=new Image();
    img.onload=()=>{
      const rect=app.drawCanvas.getBoundingClientRect();
      app.drawCtx.clearRect(0,0,app.drawCanvas.width,app.drawCanvas.height);
      app.drawCtx.drawImage(img,0,0,rect.width,rect.height);
      app.hasDrawing=true;
    };
    img.src=item.drawing;
  }else{
    setPoseMode("articulations");
  }

  requestRender();
  toast("Pose chargée");
}

/* ============================================================
   AIDE + TOAST
============================================================ */

$("studio-help").onclick=()=>{
  const messages={
    pose:"Tirez une main, un pied ou le milieu du dos. Le coude, le genou ou la courbure du buste suivent automatiquement. 2 doigts : orbit.",
    lumiere:"Faites glisser la figure pour tourner l'angle de vue et régler la lumière.",
    scene:"Un doigt : saisir une articulation. Deux doigts : zoom et rotation de la caméra."
  };
  toast(messages[app.studioTab]);
};

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(app.toastTimer);
  app.toastTimer=setTimeout(()=>{el.classList.remove("show");},2200);
}

/* ============================================================
   ÉTAT INITIAL
============================================================ */

renderLib();
renderKFs();
$("timeline").value=0;
setPoseMode("articulations");
setStudioTab("pose");
showScreen("accueil");
requestRender();

/* double tap pour reset caméra studio */
let lastTap=0;
svgStudio.addEventListener("pointerdown",e=>{
  if(app.poseMode==="dessiner")return;
  const now=performance.now();
  if(now-lastTap<320){
    app.studioCam.reset();
    app.studioCam.W=400;app.studioCam.H=460;
    app.studioCam.distance=620;
    requestRender();
  }
  lastTap=now;
});

/* empêcher menu contextuel */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());

})();
</script>
